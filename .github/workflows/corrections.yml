name: Sprite corrections

on:
  pull_request:
    paths: [corrections.json]
  push:
    branches: [dev]
    paths: [corrections.json]

jobs:
  # on a pull request: make sure the listed fixes make sense
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python .github/scripts/corrections.py check

  # once merged into dev: fix the sprites and open a pull request with them
  # (dev is protected, so the owner merges the fixes like any other change)
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python .github/scripts/corrections.py apply
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          branch="sprite-fixes-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A sprites corrections.json
          git commit -m "Apply sprite corrections"
          git push origin "$branch"
          gh pr create --base dev --head "$branch" --title "Apply sprite corrections" \
            --body "Fixes the sprites listed in corrections.json and moves the entries to \"applied\"."
