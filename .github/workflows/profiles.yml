name: Digimon profiles

on:
  pull_request:
    paths: [digimon.json]

jobs:
  # make sure digimon.json still reads correctly: required fields, known stages,
  # and every evolution pointing at a Digimon that has a profile
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/profiles.py check
